<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartes de terrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout : une colonne de cartes d'outils, une par alpage */
:root {
  --bg: #eef2ec; --panel: #ffffff; --fg: #1d2722; --muted: #5d6b63; --line: #d9dfda;
  --water: #1d4ed8; --vine: #7a3e65; --soon: #9ca3af;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #141a17; --panel: #1b2320; --fg: #e4ebe6; --muted: #98a69e; --line: #2d3833;
  --water: #60a5fa; --vine: #d38bbd; --soon: #6b7280; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; letter-spacing: .01em; }
.intro { margin: 0; color: var(--muted); }
h2 { margin: 10px 0 0; font-family: var(--f-display); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tools { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.tool { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
a.tool:hover, a.tool:focus-visible { border-color: var(--water); }
a.tool:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.tool .ic { width: 40px; height: 40px; display: grid; place-items: center; }
.tool strong { display: block; font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; }
.tool span.d { color: var(--muted); font-size: .92rem; }
.tool .go { color: var(--water); font-weight: 600; font-size: 1.4rem; }
.tool.soon { opacity: .75; }
.tag { font-family: var(--f-display); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--soon); border: 1px solid currentColor; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Cartes de terrain</h1>
  <p class="intro">Réseaux d'eau des alpages, sur le téléphone.</p>

  <h2>Alpages</h2>
  <ul class="tools">
    <li><a class="tool" href="serin/">
      <span class="ic"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 26 13 9l6 9 4-5 8 13z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 30c6-3 10 1 15-2s8-1 11-3" fill="none" stroke="var(--water)" stroke-width="2.5" stroke-linecap="round"/></svg></span>
      <span><strong>Alpage de Serin</strong><span class="d">Conduites, vannes, purges et bassins</span></span>
      <span class="go" aria-hidden="true">›</span></a></li>
    <li><div class="tool soon">
      <span class="ic"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 26 13 9l6 9 4-5 8 13z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>
      <span><strong>Deuxième alpage</strong><span class="d">En attente du plan AutoCAD</span></span>
      <span class="tag">Bientôt</span></div></li>
  </ul>

</main>
</body>
</html>
